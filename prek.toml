# Only install pre-push hooks (no pre-commit hooks in this project)
default_install_hook_types = ["pre-push"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "lint"
name = "Run linters"
language = "system"
entry = "npm run lint"
always_run = true
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "test"
name = "Run JS tests"
language = "system"
entry = "npm run test"
always_run = true
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "test-go"
name = "Run Go tests"
language = "system"
entry = "npm run test:go"
always_run = true
pass_filenames = false
stages = ["pre-push"]
