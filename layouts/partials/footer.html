<!-- Bootstrap core JavaScript
================================================== -->
<!-- Placed at the end of the document so the pages load faster -->
<!-- The bundle includes Popper; Bootstrap 5 has no jQuery dependency -->
<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
  crossorigin="anonymous"
></script>
<!-- Add anchor links to posts: https://www.bryanbraun.com/anchorjs/ -->
<script
  src="https://cdn.jsdelivr.net/npm/anchor-js@4.3.1/anchor.min.js"
  integrity="sha256-0WMZ9PF4b2hTF66Eglv/9H5Vwk6lnOG4AbmCJxo96WQ="
  crossorigin="anonymous"
></script>
<!-- prettier-ignore -->
{{ partial "mathjax.html" . }}

<!-- prettier-ignore -->
{{ partial "search-index.html" . }}

<!-- Go WASM -->
{{ if .Params.wasmEnabled }}
<!-- Import and hash -->
{{ $wasmExec := resources.Get "/js/exp/wasm/wasm_exec.js" |
resources.Fingerprint "sha256" }}
<script
  src="{{ $wasmExec.RelPermalink }}"
  integrity="{{ $wasmExec.Data.Integrity }}"
></script>
{{ end }}

<script>
  // Add anchor links to any desired content, comma-separated.
  anchors.add(
    '.type-blog #content h1, .type-blog #content h2, .type-blog #content h3, .type-blog #content h4'
  );
</script>

<script>
  // highlight menu bar appropriately: http://stackoverflow.com/questions/11813498/make-twitter-bootstrap-navbar-link-active#answer-25082875
  document.addEventListener('DOMContentLoaded', function () {
    document
      .querySelectorAll(
        '.navbar-nav a[href="' + window.location.pathname + '"]'
      )
      .forEach(function (link) {
        link.classList.add('active');
        link.setAttribute('aria-current', 'page');
      });
  });
</script>
