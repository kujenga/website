<!-- Latest compiled and minified CSS for Bootstrap and Font Awesome -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
  integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
  crossorigin="anonymous"
/>
<link
  href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css"
  rel="stylesheet"
  integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN"
  crossorigin="anonymous"
/>
<!-- Font -->
<link rel="preconnect" href="https://fonts.bunny.net" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.bunny.net/css2?family=Lato:wght@300&display=swap"
  rel="stylesheet"
/>
<link
  href="https://fonts.bunny.net/css2?family=Inconsolata&family=Lato:wght@300&display=swap"
  rel="stylesheet"
/>

<!-- Custom CSS -->
{{ $styleTemplate := resources.Get "styles/main.tpl.scss" }}
<!-- Render it with templating logic: https://gohugo.io/hugo-pipes/resource-from-template/ -->
{{ $style := $styleTemplate | resources.ExecuteAsTemplate "styles/main.scss" . |
toCSS | minify | fingerprint }}
<link
  rel="stylesheet"
  href="{{ $style.RelPermalink }}"
  integrity="{{ $style.Data.Integrity }}"
/>
